<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stenio's Barbearia – Mais que um corte, uma experiência</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold-deep: #a67b1e;
      --gold: #c8a455;
      --gold-light: #d8c87d;
      --gold-peak: #e2d48b;
      --gold-dim: #7a6228;
      --gold-gradient: linear-gradient(135deg, #a67b1e 0%, #c8a455 35%, #e2d48b 55%, #c8a455 75%, #a67b1e 100%);
      --gold-gradient-soft: linear-gradient(135deg, #b8902f 0%, #d8c87d 50%, #a67b1e 100%);
      --black: #0a0a0a;
      --black2: #111111;
      --black3: #181818;
      --black4: #222222;
      --white: #f5f0e8;
      --white-dim: #a09880;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }

    /* NOISE TEXTURE */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

    /* TYPOGRAPHY */
    h1, h2, h3 { font-family: var(--font-serif); line-height: 1.1; }
    p { line-height: 1.7; color: var(--white-dim); }
    a { text-decoration: none; color: inherit; }

    .gold { color: var(--gold); }
    .gold-grad-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .gold-grad-bg {
      background: var(--gold-gradient);
    }
    .serif { font-family: var(--font-serif); }

    /* GOLD RULE */
    .gold-rule {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 16px;
    }
    .gold-rule::before, .gold-rule::after {
      content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .gold-rule span {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em;
      color: var(--gold); text-transform: uppercase;
    }

    .section-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em;
      color: var(--gold); text-transform: uppercase; display: block;
      margin-bottom: 16px;
    }

    /* BUTTONS */
    .btn-gold {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--gold-gradient); color: var(--black);
      font-family: var(--font-sans); font-weight: 600; font-size: 13px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 16px 36px; border: none; cursor: pointer;
      transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .btn-gold::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.3s;
    }
    .btn-gold:hover::before { opacity: 1; }
    .btn-gold:hover { background: linear-gradient(135deg, #c8a455 0%, #e2d48b 50%, #c8a455 100%); transform: translateY(-1px); box-shadow: 0 8px 32px rgba(201,166,70,0.4); }

    .btn-outline {
      display: inline-flex; align-items: center; gap: 10px;
      background: transparent; color: var(--gold);
      font-family: var(--font-sans); font-weight: 500; font-size: 13px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 15px 35px; border: 1px solid var(--gold); cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-outline:hover { background: var(--gold-gradient); color: var(--black); border-color: transparent; }

    /* SECTIONS */
    section { padding: 100px 0; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }

    /* IMAGE PLACEHOLDER */
    .img-placeholder {
      background: var(--black3);
      border: 1px solid rgba(201,166,70,0.1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--gold-dim); font-family: var(--font-mono); font-size: 11px;
      text-align: center; letter-spacing: 0.1em;
      position: relative; overflow: hidden;
    }
    .img-placeholder::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent, transparent 20px,
        rgba(201,166,70,0.03) 20px, rgba(201,166,70,0.03) 21px
      );
    }
    .img-placeholder .ph-icon {
      width: 40px; height: 40px; opacity: 0.3;
      border: 1px solid currentColor; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; position: relative; z-index: 1;
    }
    .img-placeholder span { position: relative; z-index: 1; opacity: 0.5; }

    /* FADE IN ANIMATION */
    .fade-up {
      opacity: 0; transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ===== NAV ===== */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 0 40px;
      transition: all 0.4s ease;
    }
    nav.scrolled {
      background: rgba(10,10,10,0.96);
      border-bottom: 1px solid rgba(201,166,70,0.1);
      backdrop-filter: blur(12px);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 80px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 12px;
    }
    .nav-logo-badge {
      width: 48px; height: 48px;
      background: var(--gold-gradient);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-size: 20px; font-weight: 700;
      color: var(--black); letter-spacing: -1px;
    }
    .nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
    .nav-logo-text strong {
      font-family: var(--font-serif); font-size: 18px; font-weight: 700; letter-spacing: 0.05em;
    }
    .nav-logo-text span {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.25em;
      color: var(--gold); text-transform: uppercase;
    }
    .nav-links {
      display: flex; align-items: center; gap: 36px; list-style: none;
    }
    .nav-links a {
      font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--white-dim); transition: color 0.2s;
      position: relative; padding-bottom: 4px;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: var(--gold); transform: scaleX(0); transition: transform 0.3s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a:hover::after { transform: scaleX(1); }
    .nav-clube {
      background: var(--gold-gradient); color: var(--black) !important;
      padding: 8px 20px; font-weight: 600 !important;
    }
    .nav-clube:hover { background: linear-gradient(135deg, #c8a455 0%, #e2d48b 50%, #c8a455 100%) !important; }
    .nav-clube::after { display: none !important; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .lang-select {
      background: transparent; border: 1px solid rgba(201,166,70,0.3);
      color: var(--white-dim); font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.1em; padding: 6px 12px; cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .lang-select:hover { border-color: var(--gold); }
    .lang-select option { background: var(--black2); }

    /* ===== HERO ===== */
    #hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 0; position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background: var(--black);
    }
    .hero-bg-lines {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,166,70,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,166,70,0.04) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    .hero-bg-radial {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 70% at 70% 50%, rgba(201,166,70,0.06) 0%, transparent 70%);
    }
    .hero-photo {
      position: absolute; right: 0; top: 0; bottom: 0; width: 55%;
      z-index: 1;
    }
    .hero-photo .img-placeholder { width: 100%; height: 100%; }
    .hero-photo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--black) 0%, rgba(10,10,10,0.7) 40%, rgba(10,10,10,0.2) 100%);
    }
    .hero-content {
      position: relative; z-index: 2;
      max-width: 1200px; margin: 0 auto; padding: 0 40px;
      width: 100%;
    }
    .hero-eyebrow {
      display: flex; align-items: center; gap: 16px; margin-bottom: 32px;
    }
    .hero-eyebrow-line { width: 48px; height: 1px; background: var(--gold-gradient); }
    .hero-eyebrow span {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em;
      color: var(--gold); text-transform: uppercase;
    }
    .hero-badge {
      width: 90px; height: 90px; margin-bottom: 40px;
      border-radius: 50%; border: 1px solid rgba(201,166,70,0.4);
      display: flex; align-items: center; justify-content: center;
      background: rgba(201,166,70,0.05);
      position: relative;
    }
    .hero-badge::before {
      content: ''; position: absolute; inset: -6px;
      border-radius: 50%; border: 1px solid rgba(201,166,70,0.15);
    }
    .hero-badge-inner {
      width: 60px; height: 60px; background: var(--gold-gradient);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--black);
    }
    .hero-h1 {
      font-size: clamp(44px, 6vw, 80px); font-weight: 700;
      line-height: 1.0; letter-spacing: -0.02em;
      max-width: 600px; margin-bottom: 24px;
    }
    .hero-h1 em {
      font-style: italic;
      background: var(--gold-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero-sub {
      font-size: 17px; color: var(--white-dim); max-width: 440px;
      line-height: 1.7; margin-bottom: 48px;
    }
    .hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 72px; }
    .hero-stats {
      display: flex; gap: 48px;
      padding-top: 48px;
      border-top: 1px solid rgba(201,166,70,0.15);
    }
    .hero-stat-num {
      font-family: var(--font-serif); font-size: 36px; font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      line-height: 1;
    }
    .hero-stat-label {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
      color: var(--white-dim); text-transform: uppercase; margin-top: 6px;
    }

    /* ===== SOBRE ===== */
    #sobre { background: var(--black2); }
    .sobre-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
    }
    .sobre-img { height: 560px; }
    .sobre-content h2 {
      font-size: clamp(36px, 4vw, 52px); line-height: 1.1; margin-bottom: 24px;
    }
    .sobre-content p { font-size: 16px; margin-bottom: 20px; }
    .sobre-pillars {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 36px 0;
    }
    .sobre-pillar {
      padding: 20px; border: 1px solid rgba(201,166,70,0.15);
      background: rgba(201,166,70,0.02);
      transition: border-color 0.3s;
    }
    .sobre-pillar:hover { border-color: rgba(201,166,70,0.4); }
    .sobre-pillar-title {
      font-family: var(--font-serif); font-size: 16px; font-weight: 600;
      color: var(--gold); margin-bottom: 8px;
    }
    .sobre-pillar p { font-size: 13px; color: var(--white-dim); margin: 0; line-height: 1.6; }
    .desde-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
      color: var(--gold); margin-bottom: 16px;
    }
    .desde-badge::before { content: ''; width: 24px; height: 1px; background: var(--gold); }

    /* ===== SERVIÇOS ===== */
    #servicos { background: var(--black); }
    .servicos-head { text-align: center; margin-bottom: 64px; }
    .servicos-head h2 { font-size: clamp(36px, 4vw, 52px); margin-bottom: 16px; }
    .services-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: rgba(201,166,70,0.1);
    }
    .service-card {
      background: var(--black2); padding: 40px 32px;
      position: relative; overflow: hidden;
      transition: background 0.4s;
      cursor: pointer;
    }
    .service-card::before {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: var(--gold);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.4s ease;
    }
    .service-card:hover { background: var(--black3); }
    .service-card:hover::before { transform: scaleX(1); }
    .service-icon {
      width: 52px; height: 52px; border: 1px solid rgba(201,166,70,0.3);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px; font-size: 22px;
      transition: border-color 0.3s, background 0.3s;
    }
    .service-card:hover .service-icon {
      border-color: var(--gold); background: rgba(201,166,70,0.08);
    }
    .service-name {
      font-family: var(--font-serif); font-size: 20px; font-weight: 600;
      margin-bottom: 12px; color: var(--white);
    }
    .service-desc { font-size: 14px; color: var(--white-dim); line-height: 1.6; margin-bottom: 24px; }
    .service-price {
      font-family: var(--font-mono); font-size: 13px; color: var(--gold); letter-spacing: 0.1em;
    }
    .service-shine {
      position: absolute; top: -50%; right: -50%;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(201,166,70,0.08) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.4s;
    }
    .service-card:hover .service-shine { opacity: 1; }

    /* ===== EQUIPE ===== */
    #equipe { background: var(--black3); }
    .equipe-head { text-align: center; margin-bottom: 56px; }
    .equipe-head h2 { font-size: clamp(36px, 4vw, 52px); margin-bottom: 16px; }

    .equipe-carousel {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
    }
    .equipe-track-wrap {
      position: relative;
      overflow: hidden;
      padding: 4px;
      margin: -4px;
    }
    .equipe-track {
      display: flex;
      gap: 24px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .equipe-card {
      flex: 0 0 calc((100% - 24px * 3) / 4);
      position: relative;
      cursor: pointer;
      transition: transform 0.4s ease;
    }
    .equipe-card:hover { transform: translateY(-4px); }
    .equipe-photo {
      position: relative;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: var(--black2);
    }
    .equipe-photo .img-placeholder { width: 100%; height: 100%; }
    .equipe-photo::after {
      content: ''; position: absolute; inset: 0;
      border: 1px solid rgba(201,166,70,0.18);
      pointer-events: none;
      transition: border-color 0.4s;
    }
    .equipe-card:hover .equipe-photo::after { border-color: rgba(201,166,70,0.5); }
    .equipe-photo-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.3) 50%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 22px 20px;
      transition: background 0.4s;
    }
    .equipe-card:hover .equipe-photo-overlay {
      background: linear-gradient(to top, rgba(10,10,10,0.96) 0%, rgba(10,10,10,0.5) 60%, rgba(201,166,70,0.05) 100%);
    }
    .equipe-photo-num {
      position: absolute; top: 16px; left: 16px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em;
      color: var(--gold); background: rgba(10,10,10,0.7);
      padding: 6px 10px; border: 1px solid rgba(201,166,70,0.25);
      z-index: 2;
    }
    .equipe-card-name {
      font-family: var(--font-serif); font-size: 22px; font-weight: 600;
      color: var(--white); line-height: 1.1; margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .equipe-card-role {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.22em;
      background: var(--gold-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      text-transform: uppercase;
    }
    .equipe-card-meta {
      display: flex; gap: 14px;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
      max-height: 0; overflow: hidden; opacity: 0;
      transition: all 0.4s ease;
    }
    .equipe-card:hover .equipe-card-meta {
      max-height: 80px; opacity: 1;
    }
    .equipe-card-meta-item {
      display: flex; flex-direction: column; gap: 2px;
    }
    .equipe-card-meta-label {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em;
      color: var(--white-dim); text-transform: uppercase;
    }
    .equipe-card-meta-val {
      font-family: var(--font-serif); font-size: 13px; color: var(--white);
    }

    .equipe-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 36px; gap: 24px;
    }
    .equipe-arrows { display: flex; gap: 12px; }
    .equipe-arrow {
      width: 48px; height: 48px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent; color: var(--white);
      cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .equipe-arrow:hover:not(:disabled) {
      border-color: var(--gold); color: var(--gold);
      background: rgba(201,166,70,0.05);
    }
    .equipe-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
    .equipe-arrow svg { width: 16px; height: 16px; }
    .equipe-progress {
      flex: 1; height: 1px; background: rgba(255,255,255,0.12);
      position: relative; max-width: 320px;
    }
    .equipe-progress-bar {
      position: absolute; top: 0; left: 0; height: 100%;
      background: var(--gold-gradient);
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .equipe-counter {
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.2em; color: var(--white-dim);
      min-width: 80px; text-align: right;
    }
    .equipe-counter strong { color: var(--white); font-weight: 500; }

    @media (max-width: 1100px) {
      .equipe-card { flex: 0 0 calc((100% - 24px * 2) / 3); }
    }

    /* ===== CLUBE ===== */
    #clube {
      background: var(--black2);
      position: relative; overflow: hidden;
    }
    #clube::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(201,166,70,0.06) 0%, transparent 70%);
    }
    .clube-inner {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
    }
    .clube-badge-container { display: flex; justify-content: center; }
    .clube-badge {
      width: 280px; height: 280px;
      border: 1px solid rgba(201,166,70,0.3);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; gap: 8px;
    }
    .clube-badge::before {

function ImgPH({ label, style = {} }) {

      <div className="ph-icon">▣</div>
      <span>{label}</span>
    </div>
  );
}

// ─── FADE UP HOOK ────────────────────────────────────────────────────────────
function useFadeUp(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { el.classList.add('visible'); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
}

function FadeSection({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  useFadeUp(ref);
  return (
    <div ref={ref} className={`fade-up ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

// ─── EQUIPE CAROUSEL ─────────────────────────────────────────────────────────
function useVisibleCount() {
  const [n, setN] = useState(() => {
    if (typeof window === 'undefined') return 4;
    const w = window.innerWidth;
    if (w <= 640) return 1;
    if (w <= 1024) return 2;
    if (w <= 1100) return 3;
    return 4;
  });
  useEffect(() => {
    const onResize = () => {
      const w = window.innerWidth;
      if (w <= 640) setN(1);
      else if (w <= 1024) setN(2);
      else if (w <= 1100) setN(3);
      else setN(4);
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return n;
}

function EquipeCarousel({ team, labels }) {
  const total = team.length;
  const visible = useVisibleCount();
  const maxIdx = Math.max(0, total - visible);
  const [idx, setIdx] = useState(0);
  const [paused, setPaused] = useState(false);
  const wrapRef = useRef(null);

  // Clamp idx if visible count grows
  useEffect(() => {
    if (idx > maxIdx) setIdx(maxIdx);
  }, [maxIdx, idx]);

  useEffect(() => {
    if (paused || total <= visible) return;
    const id = setInterval(() => {
      setIdx(i => (i >= maxIdx ? 0 : i + 1));
    }, 5500);
    return () => clearInterval(id);
  }, [paused, maxIdx, visible, total]);

  const prev = () => setIdx(i => Math.max(0, i - 1));
  const next = () => setIdx(i => Math.min(maxIdx, i + 1));

  // Keyboard nav when carousel in viewport
  useEffect(() => {
    const onKey = (e) => {
      const el = wrapRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const inView = r.top < window.innerHeight * 0.8 && r.bottom > window.innerHeight * 0.2;
      if (!inView) return;
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx, maxIdx]);

  // Touch swipe
  const touchX = useRef(null);
  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
    touchX.current = null;
  };

  // Compute translate: each step is one card width including the gap between cards
  // We use the same flex-basis formula as CSS: card width = (100% - gap*(visible-1)) / visible
  // Translating the track by N cards: -(N * (cardWidth + gap)).
  // Easier: express as percent of the track-wrap width.
  const trackStyle = {
    transform: `translateX(calc(${-idx * 100 / visible}% - ${idx * 24 / visible}px))`,
  };

  const progressPct = total <= visible ? 100 : ((idx + visible) / total) * 100;

  return (
    <div
      className="equipe-carousel"
      ref={wrapRef}
      onMouseEnter={() => setPaused(true)}
      onMouseLeave={() => setPaused(false)}
    >
      <div
        className="equipe-track-wrap"
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
      >
        <div className="equipe-track" style={trackStyle}>
          {team.map((m, i) => (
            <div className="equipe-card" key={i}>
              <div className="equipe-photo">
                <span className="equipe-photo-num">
                  {String(i + 1).padStart(2, '0')}
                </span>
                <ImgPH label={`foto · ${m.name}`} style={{ width: '100%', height: '100%' }} />
                <div className="equipe-photo-overlay">
                  <div className="equipe-card-name">{m.name}</div>
                  <div className="equipe-card-role">{m.role}</div>
                  <div className="equipe-card-meta">
                    <div className="equipe-card-meta-item">
                      <div className="equipe-card-meta-label">{labels.exp}</div>
                      <div className="equipe-card-meta-val">{m.exp}</div>
                    </div>
                    <div className="equipe-card-meta-item">
                      <div className="equipe-card-meta-label">{labels.spec}</div>
                      <div className="equipe-card-meta-val">{m.spec}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="equipe-controls">
        <div className="equipe-arrows">
          <button className="equipe-arrow" onClick={prev} disabled={idx === 0} aria-label={labels.prev}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M15 18l-6-6 6-6" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          <button className="equipe-arrow" onClick={next} disabled={idx >= maxIdx} aria-label={labels.next}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M9 6l6 6-6 6" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
        <div className="equipe-progress">
          <div className="equipe-progress-bar" style={{ width: `${progressPct}%` }}></div>
        </div>
        <div className="equipe-counter">
          <strong>{String(Math.min(total, idx + visible)).padStart(2, '0')}</strong> / {String(total).padStart(2, '0')}
        </div>
      </div>
    </div>
  );
}

                  <path d="M16 2C8.268 2 2 8.268 2 16c0 2.462.635 4.775 1.748 6.786L2 30l7.43-1.724A13.94 13.94 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm-3.14 7.46c-.213 0-.56.08-.854.4-.293.32-1.12 1.093-1.12 2.666 0 1.573 1.147 3.094 1.307 3.307.16.213 2.24 3.547 5.48 4.827 2.24.867 3.04.747 3.587.64.547-.107 1.76-.72 2.013-1.413.254-.693.254-1.293.18-1.413-.08-.12-.293-.187-.614-.347-.32-.16-1.893-.933-2.186-1.04-.294-.106-.507-.16-.72.16-.213.32-.827.947-.987 1.16-.16.213-.32.24-.614.08-.293-.16-1.24-.453-2.36-1.453-.867-.773-1.453-1.733-1.626-2.026-.174-.293-.014-.454.12-.6.12-.133.293-.346.44-.52.146-.173.173-.293.266-.493.093-.2.04-.373-.027-.52-.066-.147-.693-1.707-.96-2.334-.253-.6-.507-.52-.72-.52l-.614-.013z"/>
                </svg>
                {t.hero_cta}
              </a>
              <a href="#servicos" className="btn-outline" style={{ color: gold, borderColor: gold }}>
                {t.hero_cta2}
              </a>
            </div>
          </FadeSection>
          <FadeSection delay={500}>
            <div className="hero-stats">
              <div>
                <div className="hero-stat-num">{t.stat1}</div>
                <div className="hero-stat-label">{t.stat1l}</div>
              </div>
              <div>
                <div className="hero-stat-num">{t.stat2}</div>
                <div className="hero-stat-label">{t.stat2l}</div>
              </div>
              <div>
                <div className="hero-stat-num">{t.stat3}</div>
                <div className="hero-stat-label">{t.stat3l}</div>
              </div>
            </div>
          </FadeSection>
        </div>
      </section>

      {/* SOBRE */}
      <section id="sobre">
        <div className="container">
          <div className="sobre-grid">
            <FadeSection>
              <div className="sobre-img">
                <ImgPH label="ambiente da barbearia" style={{ width: '100%', height: '100%' }} />
              </div>
            </FadeSection>
            <FadeSection delay={200} className="sobre-content">
              <span className="desde-badge" style={{ color: gold }}>Desde 2019</span>
              <span className="section-label" style={{ color: gold }}>{t.sobre_tag}</span>
              <h2 dangerouslySetInnerHTML={{ __html: t.sobre_h.replace(/(arte|art)/, '<em class="gold-grad-text" style="font-style:italic">$1</em>') }}></h2>
              <p>{t.sobre_p1}</p>
              <p>{t.sobre_p2}</p>
              <div className="sobre-pillars">
                {[
                  [t.p_exp, t.p_exp_d],
                  [t.p_att, t.p_att_d],
                  [t.p_amb, t.p_amb_d],
                  [t.p_prod, t.p_prod_d],
                ].map(([title, desc], i) => (
                  <div className="sobre-pillar" key={i}>
                    <div className="sobre-pillar-title" style={{ color: gold }}>{title}</div>
                    <p>{desc}</p>
                  </div>
                ))}
              </div>
              <a href="https://wa.me/5531999999999" className="btn-gold">
                {t.hero_cta}
              </a>
            </FadeSection>
          </div>
        </div>
      </section>

      {/* SERVIÇOS */}
      <section id="servicos">
        <div className="container">
          <FadeSection className="servicos-head">
            <span className="section-label" style={{ color: gold }}>{t.servicos_tag}</span>
            <h2>{t.servicos_h}</h2>
            <div className="gold-rule" style={{ marginTop: 16, marginBottom: 0 }}>
              <span style={{ color: gold }}>— — —</span>
            </div>
          </FadeSection>
        </div>
        <div className="container" style={{ padding: '0 40px', maxWidth: 1200, margin: '0 auto' }}>
          <FadeSection>
            <div className="services-grid">
              {services.map((s, i) => (
                <div className="service-card" key={i}>
                  <div className="service-shine"></div>
                  <div className="service-icon">{s.icon}</div>
                  <div className="service-name">{s.name}</div>
                  <p className="service-desc">{s.desc}</p>

                </div>
              ))}
            </div>
          </FadeSection>
        </div>
      </section>

      {/* EQUIPE */}
      <section id="equipe">
        <div className="container">
          <FadeSection className="equipe-head">
            <span className="section-label" style={{ color: gold }}>{t.equipe_tag}</span>
            <h2>{t.equipe_h}</h2>
          </FadeSection>
          <FadeSection>
            <EquipeCarousel
              team={team}
              labels={{
                tag: t.equipe_label,
                exp: t.equipe_exp_label,
                spec: t.equipe_spec_label,
                prev: t.equipe_prev,
                next: t.equipe_next,
                go: t.equipe_go,
              }}
            />
          </FadeSection>
        </div>
      </section>

      {/* CLUBE */}
      {tweaks.showClub && (
        <section id="clube">
          <div className="container">
            <div className="clube-inner">
              <FadeSection className="clube-badge-container">
                <div className="clube-badge" style={{ borderColor: `rgba(201,166,70,0.3)` }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.25em', color: 'var(--white-dim)', marginBottom: 2 }}>PLANO</div>
                  <div className="clube-badge-name" style={{ color: 'var(--white)', fontSize: 20, letterSpacing: '0.08em' }}>BASIC</div>
                  <div className="clube-badge-sub" style={{ marginBottom: 16 }}>Ter — Qui · Ilimitado</div>
                  <div style={{ width: '60%', height: 1, background: 'rgba(201,166,70,0.25)' }}></div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.25em', color: 'var(--white-dim)', marginTop: 16, marginBottom: 2 }}>PLANO</div>
                  <div className="clube-badge-name" style={{ fontSize: 20, letterSpacing: '0.08em' }}>PRIME</div>
                  <div className="clube-badge-sub">Qualquer dia · Ilimitado</div>
                </div>
              </FadeSection>
              <FadeSection delay={200} className="clube-content">
                <span className="section-label" style={{ color: gold }}>{t.clube_tag}</span>
                <h2>{t.clube_h}</h2>
                <p>{t.clube_p}</p>
                <ul className="clube-benefits">
                  {[t.clube_b1, t.clube_b2, t.clube_b3, t.clube_b4, t.clube_b5, t.clube_b6].map((b, i) => (
                    <li key={i}>{b}</li>
                  ))}
                </ul>
                <a href="https://wa.me/5531999999999" className="btn-gold">
                  {t.clube_cta}
                </a>
              </FadeSection>
            </div>
          </div>
        </section>
      )}

      {/* PRODUTOS */}
      <section id="produtos" style={{ background: 'var(--black)', paddingTop: 80, paddingBottom: 80 }}>
        <div className="container">
          <FadeSection style={{ textAlign: 'center', marginBottom: 56 }}>
            <span className="section-label" style={{ color: gold }}>Autocuidado diário</span>
            <h2 style={{ fontSize: 'clamp(32px, 4vw, 48px)', marginBottom: 16 }}>Produtos selecionados</h2>
            <p style={{ maxWidth: 520, margin: '0 auto' }}>Agregamos à sua experiência os melhores produtos masculinos para o cuidado diário em casa.</p>
          </FadeSection>
          <FadeSection>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 1, background: 'rgba(201,166,70,0.08)' }}>
              {[
                { icon: '◎', name: 'Shampoo', desc: 'Limpeza profunda e hidratação' },
                { icon: '◈', name: 'Leave In', desc: 'Proteção e brilho sem enxágue' },
                { icon: '◉', name: 'Balm', desc: 'Hidratação e maciez para a barba' },
                { icon: '◆', name: 'Óleo de Barba', desc: 'Nutrição e acabamento premium' },
                { icon: '✦', name: 'Pomada', desc: 'Modelagem e fixação versátil' },
              ].map((p, i) => (
                <div key={i} style={{
                  background: 'var(--black2)', padding: '36px 24px',
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  textAlign: 'center', gap: 12, transition: 'background 0.3s',
                  cursor: 'default',
                }}
                onMouseEnter={e => e.currentTarget.style.background = 'var(--black3)'}
                onMouseLeave={e => e.currentTarget.style.background = 'var(--black2)'}
                >
                  <div style={{
                    width: 56, height: 56, border: `1px solid rgba(201,166,70,0.25)`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 22, color: gold, marginBottom: 4,
                  }}>{p.icon}</div>
                  <div style={{ fontFamily: 'var(--font-serif)', fontSize: 16, fontWeight: 600, color: 'var(--white)' }}>{p.name}</div>
                  <div style={{ fontSize: 13, color: 'var(--white-dim)', lineHeight: 1.5 }}>{p.desc}</div>
                </div>
              ))}
            </div>
          </FadeSection>
        </div>
      </section>

      {/* DEPOIMENTOS */}
      <section id="depoimentos">
        <div className="container">
          <FadeSection className="depoimentos-head">
            <span className="section-label" style={{ color: gold }}>{t.dep_tag}</span>
            <h2>{t.dep_h}</h2>
          </FadeSection>
        </div>
        <div className="depo-track-fade">
          <div className="depoimentos-track">
            <div className="depoimentos-row">
              {deposDuplicated.map((d, i) => (
                <div className="depo-card" key={i}>
                  <div className="depo-stars">
                    {[1,2,3,4,5].map(s => <span className="depo-star" key={s} style={{ color: gold }}>★</span>)}
                  </div>
                  <div className="depo-quote">{d.q}</div>
                  <div className="depo-author">
                    <div className="depo-avatar" style={{ color: gold }}>{d.init}</div>
                    <div>
                      <div className="depo-name">{d.name}</div>
                      <div className="depo-meta">{d.meta}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* GALERIA */}
      {tweaks.showGallery && (
        <section id="galeria">
          <div className="container">
            <FadeSection className="galeria-head">
              <span className="section-label" style={{ color: gold }}>{t.gal_tag}</span>
              <h2>{t.gal_h}</h2>
            </FadeSection>
          </div>
          <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 40px' }}>
            <FadeSection>
              <div className="galeria-mosaic">
                {galItems.map((g, i) => (
                  <div className={g.cls} key={i}>
                    <ImgPH label={g.label} style={{ width: '100%', height: '100%' }} />
                    <div className="gal-overlay">
                      <span style={{ color: gold, borderColor: gold }}>Ver foto</span>
                    </div>
                  </div>
                ))}
              </div>
            </FadeSection>
          </div>
        </section>
      )}

      {/* UNIDADES */}
      <section id="unidades">
        <div className="container">
          <FadeSection className="unidades-head">
            <span className="section-label" style={{ color: gold }}>{t.uni_tag}</span>
            <h2>{t.uni_h}</h2>
          </FadeSection>
          <FadeSection>
            <div className="unidade-card">
              <div className="unidade-map">
                <div className="map-placeholder">
                  <div className="map-pin">📍</div>
                  <p>MAPA · {t.uni_end_v}</p>
                </div>
              </div>
              <div className="unidade-info">
                <span className="unidade-tag" style={{ color: gold, borderColor: `rgba(201,166,70,0.3)` }}>{t.uni_badge}</span>
                <div className="unidade-name">{t.uni_name}</div>
                <div className="unidade-details">
                  {[
                    { icon: '◎', label: t.uni_end, value: t.uni_end_v },
                    { icon: '☏', label: t.uni_tel, value: t.uni_tel_v },
                    { icon: '◷', label: t.uni_hr, value: t.uni_hr_v },
                  ].map((d, i) => (
                    <div className="unidade-detail" key={i}>
                      <div className="unidade-detail-icon" style={{ borderColor: `rgba(201,166,70,0.2)`, color: gold }}>{d.icon}</div>
                      <div className="unidade-detail-text">
                        <strong>{d.label}</strong>
                        <span>{d.value}</span>
                      </div>
                    </div>
                  ))}
                </div>
                <a href="https://wa.me/5531999999999" className="btn-gold" style={{ background: gold, color: '#0a0a0a', marginTop: 8 }}>
                  {t.hero_cta}
                </a>
              </div>
            </div>
          </FadeSection>
        </div>
      </section>

      {/* FOOTER */}
      <footer>
        <div className="footer-top">
          <div className="footer-brand">
            <div className="footer-logo">
              <div className="footer-logo-badge" style={{ background: gold, color: '#0a0a0a' }}>S</div>
              <div className="footer-logo-text">
                <strong>Stenio's Barbearia</strong>
                <span>Premium · Desde 2019</span>
              </div>
            </div>
            <p className="footer-desc">{t.footer_desc}</p>
            <div className="footer-socials">
              {['IG', 'WA', 'FB', 'YT'].map((s, i) => (
                <div className="footer-social" key={i}>{s}</div>
              ))}
            </div>
          </div>
          <div className="footer-col">
            <h4>{t.footer_links}</h4>
            <ul>
              {(t.nav || []).slice(0, 4).map((n, i) => (
                <li key={i}><a href={['#hero','#sobre','#servicos','#equipe'][i]}>{n}</a></li>
              ))}
            </ul>
          </div>
          <div className="footer-col">
            <h4>{t.footer_serv}</h4>
            <ul>
              {[t.s1, t.s2, t.s3, t.s4].map((s, i) => (
                <li key={i}><a href="#servicos">{s}</a></li>
              ))}
            </ul>
          </div>
          <div className="footer-col">
            <h4>{t.footer_cont}</h4>
            <ul>
              <li><a href="tel:+5531999999999">{t.uni_tel_v}</a></li>
              <li><a href="https://wa.me/5531999999999">WhatsApp</a></li>
              <li><a href="#">Instagram</a></li>
              <li><a href="#">{t.uni_end_v}</a></li>
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="footer-copy">{t.copy}</span>
          <div className="footer-gold-line" style={{ background: gold }}></div>
        </div>
      </footer>

      {/* TWEAKS PANEL */}
      <TweaksPanel>
        <TweakSection title="Idioma / Language">
          <TweakRadio
            label="Idioma"
            value={tweaks.lang}
            options={[{label:'PT',value:'pt'},{label:'EN',value:'en'},{label:'ES',value:'es'}]}
            onChange={v => setTweak('lang', v)}
          />
        </TweakSection>
        <TweakSection title="Identidade Visual">
          <TweakColor
            label="Cor de destaque"
            value={tweaks.accentColor}
            onChange={v => setTweak('accentColor', v)}
          />
        </TweakSection>
        <TweakSection title="Seções">
          <TweakToggle
            label="Mostrar Clube Stenio's"
            value={tweaks.showClub}
            onChange={v => setTweak('showClub', v)}
          />
          <TweakToggle
            label="Mostrar Galeria"
            value={tweaks.showGallery}
            onChange={v => setTweak('showGallery', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
